trigger: none

pool:
  vmImage: ubuntu-latest

variables:
- group: SonarQube

steps:
- checkout: self
  fetchDepth: 0

- script: |
    npx sonar-scanner \
      -Dsonar.projectKey=uc2_core_fe \
      -Dsonar.projectName=uc2_core_fe \
      -Dsonar.sources=. \
      -Dsonar.host.url=$(SONARQUBE_HOST_URL) \
      -Dsonar.login=$(SONARQUBE_TOKEN) \
      -Dsonar.projectVersion=1.0
  displayName: 'Run SonarQube Scanner (CE, PR-safe)'
