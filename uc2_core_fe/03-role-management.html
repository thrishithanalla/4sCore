<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Role Management - AP Police</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState } = React;

        const Plus = ({ size = 20 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
        );

        const Edit = ({ size = 20 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
            </svg>
        );

        const X = ({ size = 20 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
        );

        const ChevronDown = ({ size = 20 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
        );

        const ChevronRight = ({ size = 20 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
        );

        const allPermissions = {
            'Level Management': ['levels.view', 'levels.create', 'levels.edit', 'levels.delete'],
            'Unit Management': ['units.view', 'units.create', 'units.edit', 'units.delete', 'units.transfer', 'units.approve'],
            'Post Management': ['posts.view', 'posts.create', 'posts.edit', 'posts.delete', 'posts.assign', 'posts.approve'],
            'Personnel Management': ['personnel.view', 'personnel.create', 'personnel.edit', 'personnel.assign', 'personnel.transfer', 'personnel.delete'],
            'Reports': ['reports.view', 'reports.generate', 'reports.export', 'reports.vacancy']
        };

        const initialRoles = [
            { id: 1, name: 'Super Admin', type: 'System', users: 2, permissions: Object.values(allPermissions).flat(), isActive: true, icon: '🔴' },
            { id: 2, name: 'Admin', type: 'System', users: 15, permissions: Object.values(allPermissions).flat().slice(0, 18), isActive: true, icon: '🟠' },
            { id: 3, name: 'District Admin', type: 'Custom', users: 156, permissions: ['units.view', 'units.create', 'units.edit', 'posts.view', 'posts.create', 'personnel.view', 'reports.view'], isActive: true, icon: '🟡' },
            { id: 4, name: 'SHO', type: 'Custom', users: 431, permissions: ['units.view', 'posts.view', 'posts.assign', 'personnel.view', 'personnel.assign', 'reports.view'], isActive: true, icon: '🟢' },
            { id: 5, name: 'Personnel Officer', type: 'Custom', users: 2841, permissions: ['units.view', 'personnel.view', 'reports.view'], isActive: true, icon: '🟣' },
            { id: 6, name: 'Viewer', type: 'System', users: 24, permissions: ['units.view', 'posts.view', 'personnel.view', 'reports.view'], isActive: true, icon: '⚫' }
        ];

        const RoleManagement = () => {
            const [roles, setRoles] = useState(initialRoles);
            const [expandedRole, setExpandedRole] = useState(null);
            const [showModal, setShowModal] = useState(false);
            const [editingRole, setEditingRole] = useState(null);
            const [formData, setFormData] = useState({
                name: '',
                type: 'Custom',
                permissions: [],
                icon: '🔵'
            });

            const totalPermissions = Object.values(allPermissions).flat().length;

            const handleAdd = () => {
                setEditingRole(null);
                setFormData({ name: '', type: 'Custom', permissions: [], icon: '🔵' });
                setShowModal(true);
            };

            const handleEdit = (role) => {
                setEditingRole(role);
                setFormData({
                    name: role.name,
                    type: role.type,
                    permissions: [...role.permissions],
                    icon: role.icon
                });
                setShowModal(true);
            };

            const handleSubmit = () => {
                if (!formData.name.trim()) {
                    alert('Please enter role name');
                    return;
                }

                if (editingRole) {
                    setRoles(roles.map(r => 
                        r.id === editingRole.id 
                            ? { ...r, ...formData }
                            : r
                    ));
                } else {
                    setRoles([...roles, {
                        id: Date.now(),
                        ...formData,
                        users: 0,
                        isActive: true
                    }]);
                }
                setShowModal(false);
            };

            const handleDelete = (id) => {
                if (confirm('Are you sure you want to delete this role?')) {
                    setRoles(roles.filter(r => r.id !== id));
                }
            };

            const togglePermission = (permission) => {
                if (formData.permissions.includes(permission)) {
                    setFormData({
                        ...formData,
                        permissions: formData.permissions.filter(p => p !== permission)
                    });
                } else {
                    setFormData({
                        ...formData,
                        permissions: [...formData.permissions, permission]
                    });
                }
            };

            const toggleCategory = (category) => {
                const categoryPerms = allPermissions[category];
                const allSelected = categoryPerms.every(p => formData.permissions.includes(p));
                
                if (allSelected) {
                    setFormData({
                        ...formData,
                        permissions: formData.permissions.filter(p => !categoryPerms.includes(p))
                    });
                } else {
                    setFormData({
                        ...formData,
                        permissions: [...new Set([...formData.permissions, ...categoryPerms])]
                    });
                }
            };

            return (
                <div className="min-h-screen bg-gray-50">
                    <div className="bg-gradient-to-r from-orange-600 to-red-600 text-white p-6 shadow-lg">
                        <div className="max-w-7xl mx-auto">
                            <h1 className="text-3xl font-bold">👥 Role Management</h1>
                            <p className="text-orange-100 mt-2">Andhra Pradesh Police</p>
                        </div>
                    </div>

                    <div className="max-w-7xl mx-auto p-6">
                        <div className="text-sm text-gray-600 mb-6">
                            Home &gt; Admin &gt; <span className="text-orange-600 font-semibold">Roles</span>
                        </div>

                        <div className="bg-white rounded-lg shadow-sm p-4 mb-6 flex gap-3">
                            <button onClick={handleAdd} className="px-4 py-2 bg-orange-600 text-white rounded-lg hover:bg-orange-700 flex items-center gap-2">
                                <Plus size={16} /> Add Role
                            </button>
                            <button className="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200">
                                ↓ Export
                            </button>
                        </div>

                        <div className="bg-white rounded-lg shadow-sm overflow-hidden">
                            <table className="min-w-full">
                                <thead className="bg-gray-50">
                                    <tr>
                                        <th className="px-6 py-3 text-left text-xs font-semibold text-gray-700 uppercase">Role Name</th>
                                        <th className="px-6 py-3 text-left text-xs font-semibold text-gray-700 uppercase">Type</th>
                                        <th className="px-6 py-3 text-center text-xs font-semibold text-gray-700 uppercase">Users</th>
                                        <th className="px-6 py-3 text-center text-xs font-semibold text-gray-700 uppercase">Permissions</th>
                                        <th className="px-6 py-3 text-center text-xs font-semibold text-gray-700 uppercase">Status</th>
                                        <th className="px-6 py-3 text-center text-xs font-semibold text-gray-700 uppercase">Actions</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-gray-200">
                                    {roles.map((role) => (
                                        <React.Fragment key={role.id}>
                                            <tr className="hover:bg-gray-50 cursor-pointer" onClick={() => setExpandedRole(expandedRole === role.id ? null : role.id)}>
                                                <td className="px-6 py-4 whitespace-nowrap">
                                                    <div className="flex items-center gap-2">
                                                        <span className="text-2xl">{role.icon}</span>
                                                        <span className="text-sm font-medium text-gray-900">{role.name}</span>
                                                    </div>
                                                </td>
                                                <td className="px-6 py-4 whitespace-nowrap text-sm text-gray-600">{role.type}</td>
                                                <td className="px-6 py-4 whitespace-nowrap text-center text-sm text-gray-900">{role.users}</td>
                                                <td className="px-6 py-4 whitespace-nowrap text-center">
                                                    <span className="text-sm font-medium text-blue-600">
                                                        {role.permissions.length}/{totalPermissions}
                                                    </span>
                                                </td>
                                                <td className="px-6 py-4 whitespace-nowrap text-center">
                                                    <span className="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-800">
                                                        🟢 Active
                                                    </span>
                                                </td>
                                                <td className="px-6 py-4 whitespace-nowrap text-center">
                                                    <div className="flex items-center justify-center gap-2">
                                                        <button onClick={(e) => { e.stopPropagation(); handleEdit(role); }} className="text-blue-600 hover:text-blue-800">
                                                            <Edit size={16} />
                                                        </button>
                                                        <button onClick={(e) => { e.stopPropagation(); setExpandedRole(expandedRole === role.id ? null : role.id); }} className="text-gray-600">
                                                            {expandedRole === role.id ? <ChevronDown size={16} /> : <ChevronRight size={16} />}
                                                        </button>
                                                    </div>
                                                </td>
                                            </tr>
                                            {expandedRole === role.id && (
                                                <tr>
                                                    <td colSpan="6" className="px-6 py-4 bg-gray-50">
                                                        <div className="space-y-4">
                                                            <div>
                                                                <h4 className="font-semibold text-gray-700 mb-2">Permissions ({role.permissions.length})</h4>
                                                                <div className="grid grid-cols-3 gap-2">
                                                                    {Object.keys(allPermissions).map(category => {
                                                                        const categoryPerms = allPermissions[category].filter(p => role.permissions.includes(p));
                                                                        return (
                                                                            <div key={category} className="bg-white rounded p-3 border border-gray-200">
                                                                                <div className="font-semibold text-sm text-gray-700 mb-1">{category}</div>
                                                                                <div className="text-xs text-gray-600">
                                                                                    {categoryPerms.length}/{allPermissions[category].length} permissions
                                                                                </div>
                                                                            </div>
                                                                        );
                                                                    })}
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </td>
                                                </tr>
                                            )}
                                        </React.Fragment>
                                    ))}
                                </tbody>
                            </table>
                        </div>

                        <div className="mt-4 text-sm text-gray-600">
                            📊 Total: {roles.length} roles | {roles.reduce((sum, r) => sum + r.users, 0)} users assigned
                        </div>
                    </div>

                    {showModal && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-2xl shadow-2xl max-w-4xl w-full max-h-[90vh] overflow-y-auto">
                                <div className="bg-gradient-to-r from-orange-600 to-red-600 text-white p-6 rounded-t-2xl flex justify-between items-center">
                                    <h2 className="text-2xl font-bold">{editingRole ? '✏️ Edit Role' : '✨ Create New Role'}</h2>
                                    <button onClick={() => setShowModal(false)} className="text-white hover:bg-white hover:bg-opacity-20 rounded-full p-2">
                                        <X size={24} />
                                    </button>
                                </div>

                                <div className="p-6">
                                    <div className="space-y-4 mb-6">
                                        <div className="grid grid-cols-2 gap-4">
                                            <div>
                                                <label className="block text-sm font-semibold text-gray-700 mb-2">Role Name *</label>
                                                <input type="text" value={formData.name} onChange={(e) => setFormData({...formData, name: e.target.value})} className="w-full px-4 py-2 border-2 border-gray-300 rounded-lg" placeholder="e.g., District Admin" />
                                            </div>
                                            <div>
                                                <label className="block text-sm font-semibold text-gray-700 mb-2">Icon</label>
                                                <input type="text" value={formData.icon} onChange={(e) => setFormData({...formData, icon: e.target.value})} className="w-full px-4 py-2 border-2 border-gray-300 rounded-lg" placeholder="🔵" />
                                            </div>
                                        </div>

                                        <div>
                                            <label className="block text-sm font-semibold text-gray-700 mb-2">Role Type</label>
                                            <select value={formData.type} onChange={(e) => setFormData({...formData, type: e.target.value})} className="w-full px-4 py-2 border-2 border-gray-300 rounded-lg">
                                                <option value="System">System Role</option>
                                                <option value="Custom">Custom Role</option>
                                            </select>
                                        </div>
                                    </div>

                                    <div className="border-t border-gray-200 pt-4">
                                        <h3 className="text-lg font-semibold text-gray-800 mb-4">
                                            Permissions ({formData.permissions.length}/{totalPermissions})
                                        </h3>
                                        
                                        {Object.keys(allPermissions).map(category => {
                                            const categoryPerms = allPermissions[category];
                                            const selectedCount = categoryPerms.filter(p => formData.permissions.includes(p)).length;
                                            const allSelected = selectedCount === categoryPerms.length;

                                            return (
                                                <div key={category} className="mb-4 border border-gray-200 rounded-lg p-4">
                                                    <div className="flex items-center justify-between mb-3">
                                                        <label className="flex items-center gap-2 cursor-pointer">
                                                            <input type="checkbox" checked={allSelected} onChange={() => toggleCategory(category)} className="w-4 h-4" />
                                                            <span className="font-semibold text-gray-700">{category} ({selectedCount}/{categoryPerms.length})</span>
                                                        </label>
                                                    </div>
                                                    <div className="grid grid-cols-2 gap-2 pl-6">
                                                        {categoryPerms.map(perm => (
                                                            <label key={perm} className="flex items-center gap-2 text-sm cursor-pointer hover:bg-gray-50 p-2 rounded">
                                                                <input type="checkbox" checked={formData.permissions.includes(perm)} onChange={() => togglePermission(perm)} className="w-4 h-4" />
                                                                <span>{perm}</span>
                                                            </label>
                                                        ))}
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>

                                    <div className="flex gap-3 mt-6 pt-4 border-t border-gray-200">
                                        <button onClick={() => setShowModal(false)} className="flex-1 px-6 py-3 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300 font-semibold">
                                            Cancel
                                        </button>
                                        <button onClick={handleSubmit} className="flex-1 px-6 py-3 bg-orange-600 text-white rounded-lg hover:bg-orange-700 font-semibold shadow-lg">
                                            💾 {editingRole ? 'Save Changes' : 'Create Role'}
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<RoleManagement />);
    </script>
</body>
</html>
