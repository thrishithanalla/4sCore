<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Permission Management - AP Police</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState } = React;

        const ChevronDown = ({ size = 20 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
        );

        const ChevronRight = ({ size = 20 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
        );

        const initialPermissions = {
            'Level Management': [
                { code: 'levels.view', desc: 'View hierarchy levels', type: 'read', roles: 7 },
                { code: 'levels.create', desc: 'Create new levels', type: 'write', roles: 2 },
                { code: 'levels.edit', desc: 'Edit existing levels', type: 'write', roles: 2 },
                { code: 'levels.delete', desc: 'Delete levels', type: 'delete', roles: 1 }
            ],
            'Unit Management': [
                { code: 'units.view', desc: 'View all units', type: 'read', roles: 7 },
                { code: 'units.create', desc: 'Create new units', type: 'write', roles: 3 },
                { code: 'units.edit', desc: 'Edit unit details', type: 'write', roles: 3 },
                { code: 'units.delete', desc: 'Delete units', type: 'delete', roles: 2 },
                { code: 'units.transfer', desc: 'Transfer units', type: 'write', roles: 2 },
                { code: 'units.approve', desc: 'Approve unit changes', type: 'approve', roles: 1 }
            ],
            'Post Management': [
                { code: 'posts.view', desc: 'View posts', type: 'read', roles: 6 },
                { code: 'posts.create', desc: 'Create posts', type: 'write', roles: 3 },
                { code: 'posts.edit', desc: 'Edit posts', type: 'write', roles: 3 },
                { code: 'posts.delete', desc: 'Delete posts', type: 'delete', roles: 2 },
                { code: 'posts.assign', desc: 'Assign personnel to posts', type: 'write', roles: 4 },
                { code: 'posts.approve', desc: 'Approve post assignments', type: 'approve', roles: 2 }
            ],
            'Personnel Management': [
                { code: 'personnel.view', desc: 'View personnel', type: 'read', roles: 6 },
                { code: 'personnel.create', desc: 'Add personnel', type: 'write', roles: 3 },
                { code: 'personnel.edit', desc: 'Edit personnel details', type: 'write', roles: 3 },
                { code: 'personnel.assign', desc: 'Assign to units/posts', type: 'write', roles: 4 },
                { code: 'personnel.transfer', desc: 'Transfer personnel', type: 'write', roles: 3 },
                { code: 'personnel.delete', desc: 'Delete personnel', type: 'delete', roles: 1 }
            ],
            'Reports & Analytics': [
                { code: 'reports.view', desc: 'View reports', type: 'read', roles: 6 },
                { code: 'reports.generate', desc: 'Generate custom reports', type: 'write', roles: 3 },
                { code: 'reports.export', desc: 'Export reports', type: 'write', roles: 3 },
                { code: 'reports.vacancy', desc: 'View vacancy reports', type: 'read', roles: 5 }
            ]
        };

        const PermissionManagement = () => {
            const [permissions, setPermissions] = useState(initialPermissions);
            const [expandedCategories, setExpandedCategories] = useState(Object.keys(initialPermissions));

            const toggleCategory = (category) => {
                if (expandedCategories.includes(category)) {
                    setExpandedCategories(expandedCategories.filter(c => c !== category));
                } else {
                    setExpandedCategories([...expandedCategories, category]);
                }
            };

            const getTypeColor = (type) => {
                switch(type) {
                    case 'read': return 'bg-green-100 text-green-800';
                    case 'write': return 'bg-yellow-100 text-yellow-800';
                    case 'delete': return 'bg-red-100 text-red-800';
                    case 'approve': return 'bg-purple-100 text-purple-800';
                    default: return 'bg-gray-100 text-gray-800';
                }
            };

            const totalPermissions = Object.values(permissions).flat().length;

            return (
                <div className="min-h-screen bg-gray-50">
                    <div className="bg-gradient-to-r from-purple-600 to-indigo-600 text-white p-6 shadow-lg">
                        <div className="max-w-7xl mx-auto">
                            <h1 className="text-3xl font-bold">🔐 Permission Management</h1>
                            <p className="text-purple-100 mt-2">Andhra Pradesh Police</p>
                        </div>
                    </div>

                    <div className="max-w-7xl mx-auto p-6">
                        <div className="text-sm text-gray-600 mb-6">
                            Home &gt; Admin &gt; <span className="text-purple-600 font-semibold">Permissions</span>
                        </div>

                        <div className="bg-white rounded-lg shadow-sm p-4 mb-6">
                            <div className="flex items-center justify-between">
                                <div className="text-lg font-semibold text-gray-800">
                                    Total Permissions: {totalPermissions}
                                </div>
                                <div className="flex gap-4 text-sm">
                                    <div className="flex items-center gap-2">
                                        <span className="w-3 h-3 rounded-full bg-green-500"></span>
                                        <span>Read</span>
                                    </div>
                                    <div className="flex items-center gap-2">
                                        <span className="w-3 h-3 rounded-full bg-yellow-500"></span>
                                        <span>Write</span>
                                    </div>
                                    <div className="flex items-center gap-2">
                                        <span className="w-3 h-3 rounded-full bg-red-500"></span>
                                        <span>Delete</span>
                                    </div>
                                    <div className="flex items-center gap-2">
                                        <span className="w-3 h-3 rounded-full bg-purple-500"></span>
                                        <span>Approve</span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div className="space-y-4">
                            {Object.keys(permissions).map(category => {
                                const isExpanded = expandedCategories.includes(category);
                                const categoryPerms = permissions[category];
                                
                                return (
                                    <div key={category} className="bg-white rounded-lg shadow-sm overflow-hidden">
                                        <div 
                                            className="flex items-center justify-between p-4 cursor-pointer hover:bg-gray-50"
                                            onClick={() => toggleCategory(category)}
                                        >
                                            <div className="flex items-center gap-3">
                                                {isExpanded ? <ChevronDown size={20} /> : <ChevronRight size={20} />}
                                                <h3 className="text-lg font-semibold text-gray-800">{category}</h3>
                                                <span className="text-sm text-gray-500">({categoryPerms.length} permissions)</span>
                                            </div>
                                        </div>

                                        {isExpanded && (
                                            <div className="border-t border-gray-200">
                                                <table className="min-w-full">
                                                    <thead className="bg-gray-50">
                                                        <tr>
                                                            <th className="px-6 py-3 text-left text-xs font-semibold text-gray-700 uppercase">Permission Code</th>
                                                            <th className="px-6 py-3 text-left text-xs font-semibold text-gray-700 uppercase">Description</th>
                                                            <th className="px-6 py-3 text-center text-xs font-semibold text-gray-700 uppercase">Type</th>
                                                            <th className="px-6 py-3 text-center text-xs font-semibold text-gray-700 uppercase">Roles</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody className="divide-y divide-gray-200">
                                                        {categoryPerms.map(perm => (
                                                            <tr key={perm.code} className="hover:bg-gray-50">
                                                                <td className="px-6 py-4 whitespace-nowrap">
                                                                    <code className="text-sm font-mono text-blue-600">{perm.code}</code>
                                                                </td>
                                                                <td className="px-6 py-4">
                                                                    <div className="text-sm text-gray-900">{perm.desc}</div>
                                                                </td>
                                                                <td className="px-6 py-4 whitespace-nowrap text-center">
                                                                    <span className={`inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium ${getTypeColor(perm.type)}`}>
                                                                        {perm.type}
                                                                    </span>
                                                                </td>
                                                                <td className="px-6 py-4 whitespace-nowrap text-center">
                                                                    <span className="text-sm font-medium text-gray-900">{perm.roles}</span>
                                                                </td>
                                                            </tr>
                                                        ))}
                                                    </tbody>
                                                </table>
                                            </div>
                                        )}
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<PermissionManagement />);
    </script>
</body>
</html>
