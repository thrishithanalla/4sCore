server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    # Enable gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Module Federation remoteEntry.js - critical for MFE loading
    location = /core/remoteEntry.js {
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        alias /usr/share/nginx/html/remoteEntry.js;
    }

    # Static assets under /core/ - serve directly using alias
    location ~ ^/core/(.+\.(js|css|map|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|json))$ {
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        alias /usr/share/nginx/html/$1;
    }
    
    # Everything else - return 404
    # This forces ingress to NOT match this service for HTML/SPA routes
    location / {
        return 404;
    }
}
